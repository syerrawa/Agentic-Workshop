- id: "1"
  title: The eval run and the four code scorers
  description: >-
    Build eval/run_eval.py: drive the Epic 2 agent over all 20 tickets in
    eval/labelled_tickets.csv via mlflow.genai.evaluate, logging one run to
    the triage-agent experiment (CAP-1). Wire up valid_schema, category_match,
    priority_match, and tool_order (CAP-2 through CAP-5), and auto-approve
    every escalation so the run never waits on a person (CAP-8).
- id: "2"
  title: The rationale judge and the report
  description: >-
    Add the rationale_judge scorer, calling OpenRouter with JUDGE_MODEL/OPENROUTER_API_KEY,
    independent of the agent's MODEL (CAP-6). Print the mean of all five scorers, the
    agent's total tokens, and the escalation count, and write the same numbers
    to eval/latest_report.json (CAP-7).
